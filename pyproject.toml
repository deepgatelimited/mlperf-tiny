requires-python = ">=3.13"
dependencies = [
    "importlib-resources>=7.1.0",
    "librosa>=0.11.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "protobuf>=6.31.1,<7",
    "pydub>=0.25.1",
    "pyserial>=3.5",
    "pyusb>=1.3",
    "tensorflow==2.21.0",
    "tensorflow-datasets==4.9.10",
    "west>=1.4",
]
